[package]
name = "et-link"
description = "The E.T. app's side of et/1: a UniFFI library for Swift."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "et_link"
# staticlib: the iOS xcframework. cdylib: uniffi-bindgen reads it on Linux.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
et-proto = { path = "../et-proto" }
iroh.workspace = true
tokio.workspace = true
anyhow.workspace = true
uniffi = { version = "0.32", features = ["cli", "tokio"] }

[dev-dependencies]
etd = { path = "../etd" }
tempfile = "3"
