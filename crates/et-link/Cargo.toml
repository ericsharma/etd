[package]
name = "et-link"
description = "The E.T. app's side of et/1: a UniFFI library for Swift."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "et_link"
# staticlib: the iOS xcframework. cdylib: uniffi-bindgen reads it on Linux.
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
et-proto = { path = "../et-proto" }
iroh.workspace = true
tokio.workspace = true
anyhow.workspace = true
uniffi = { version = "0.32", features = ["cli", "tokio"] }
serde.workspace = true
serde_json = "1"
# The manymux client core (no PTYs). Same commit as nixos-config's manymux
# input (v0.2.2); a bump changes both.
manymux = { git = "https://github.com/rayfish/manymux", rev = "ee00f0786ea67ad65e780a9b47e554461f009c50", default-features = false }
iroh-blobs.workspace = true
n0-future = "0.3"

[dev-dependencies]
etd = { path = "../etd" }
tempfile = "3"
n0-future = "0.3"
