[package]
name = "etd"
description = "Reach tmux on this machine from E.T. over iroh."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
et-proto = { path = "../et-proto" }
iroh.workspace = true
iroh-blobs.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json = "1"
postcard.workspace = true
dirs = "6"
libc = "0.2"
sha2 = "0.10"
getrandom = "0.3"
qrcode = { version = "0.14", default-features = false }
# The manymux protocol (client core, no PTYs): etd reads its own event feed
# for notifications. Same commit as nixos-config's manymux input (v0.2.2).
manymux = { git = "https://github.com/rayfish/manymux", rev = "ee00f0786ea67ad65e780a9b47e554461f009c50", default-features = false }

[dev-dependencies]
tempfile = "3"
