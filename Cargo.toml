[workspace]
resolver = "2"
members = ["crates/et-proto", "crates/etd", "crates/et-link"]

[workspace.package]
version = "0.0.5"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
iroh = { version = "1.4", default-features = false, features = ["tls-ring"] }
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "time", "sync", "signal", "net"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iroh-blobs = { version = "0.103.1", default-features = false, features = ["fs-store"] }

# iroh 1.4 → netwatch → netdev 0.46 does not build for iOS; see vendor/README.md.
# Also keep libc at 0.2.189 in Cargo.lock: 0.2.190+ hides the Apple routing
# names from iOS.
[patch.crates-io]
netdev = { path = "vendor/netdev" }
